<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set a new password — Atlas Office</title>
<!-- Tailwind CSS CDN with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for brand tokens -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            atlas: {
              bg: '#F7F7F5',
              card: '#FFFFFF',
              border: '#E5E5E2',
              inputBorder: '#D9DAD6',
              primary: '#2F6B4F',
              primaryHover: '#285D45',
              dark: '#191C1A',
              muted: '#6B6D68',
              disabledBg: '#EAECE9',
              disabledText: '#8A8C87',
              error: '#B54747',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Global base styling -->
<style data-purpose="base-styling">
    body {
      background-color: #F7F7F5;
      color: #191C1A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    input::placeholder {
      color: #9C9E9A;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-5 selection:bg-atlas-primary/20">
<!-- BEGIN: MainAuthenticationShell -->
<main class="w-full max-w-[440px] flex flex-col items-center" data-purpose="auth-shell">
<!-- BEGIN: BrandHeader -->
<!-- Centered minimal wordmark -->
<header class="mb-7 flex items-center justify-center space-x-1.5" data-purpose="brand-wordmark">
<span class="text-[20px] font-bold tracking-tight text-atlas-dark leading-none">Atlas</span>
<span class="text-[11px] font-semibold tracking-[0.14em] uppercase text-atlas-muted leading-none">OFFICE</span>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: AuthCard -->
<div class="w-full bg-atlas-card border border-atlas-border rounded-xl p-8 shadow-[0_1px_3px_rgba(0,0,0,0.02)]" data-purpose="auth-card">
<!-- Card Titles -->
<div class="mb-7" data-purpose="card-header">
<h1 class="text-[26px] font-bold text-atlas-dark tracking-tight leading-snug">Set a new password</h1>
<p class="text-[14px] text-atlas-muted mt-2 leading-relaxed">Choose a new password for your Atlas account.</p>
</div>
<!-- Reset Password Form -->
<form class="space-y-5" id="reset-password-form" novalidate="" onsubmit="event.preventDefault();">
<!-- Field 1: New Password -->
<div data-purpose="new-password-field">
<label class="block text-[14px] font-medium text-atlas-dark mb-2" for="new-password">New password</label>
<div class="relative">
<input autocomplete="new-password" class="w-full h-12 px-3.5 pr-11 text-[15px] text-atlas-dark bg-white rounded-lg border border-atlas-inputBorder focus:border-atlas-primary focus:ring-1 focus:ring-atlas-primary outline-none transition-colors" id="new-password" name="newPassword" placeholder="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-atlas-muted hover:text-atlas-dark focus:outline-none" id="toggle-new-pwd" tabindex="-1" type="button">
<!-- Eye Icon -->
<svg class="w-5 h-5 text-atlas-muted hover:text-atlas-dark" fill="none" id="eye-icon-new" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
</button>
</div>
<!-- Requirement text / error slot -->
<p class="text-[13px] text-atlas-muted mt-2 leading-tight" id="new-password-msg">Use at least 12 characters.</p>
</div>
<!-- Field 2: Confirm Password -->
<div data-purpose="confirm-password-field">
<label class="block text-[14px] font-medium text-atlas-dark mb-2" for="confirm-password">Confirm new password</label>
<div class="relative">
<input autocomplete="new-password" class="w-full h-12 px-3.5 pr-11 text-[15px] text-atlas-dark bg-white rounded-lg border border-atlas-inputBorder focus:border-atlas-primary focus:ring-1 focus:ring-atlas-primary outline-none transition-colors" id="confirm-password" name="confirmPassword" placeholder="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-atlas-muted hover:text-atlas-dark focus:outline-none" id="toggle-confirm-pwd" tabindex="-1" type="button">
<!-- Eye Icon -->
<svg class="w-5 h-5 text-atlas-muted hover:text-atlas-dark" fill="none" id="eye-icon-confirm" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
</button>
</div>
<!-- Error placeholder for confirm mismatch -->
<p class="text-[13px] text-atlas-error mt-2 leading-tight hidden" id="confirm-password-msg"></p>
</div>
<!-- Primary Submit Button -->
<div class="pt-1">
<button class="w-full h-12 rounded-lg font-medium text-[15px] transition-colors duration-150 flex items-center justify-center bg-atlas-disabledBg text-atlas-disabledText cursor-not-allowed" disabled="" id="submit-button" type="submit">
            Reset password
          </button>
</div>
</form>
<!-- Secondary Navigation -->
<nav aria-label="Secondary navigation" class="mt-6 text-center">
<a class="text-[14px] font-medium text-atlas-primary hover:underline inline-block" href="#login">
          Back to Log in
        </a>
</nav>
</div>
<!-- END: AuthCard -->
</main>
<!-- END: MainAuthenticationShell -->
<!-- BEGIN: Interactive Logic -->
<script data-purpose="auth-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const newPwdInput = document.getElementById('new-password');
      const confirmPwdInput = document.getElementById('confirm-password');
      const submitBtn = document.getElementById('submit-button');
      const newPwdMsg = document.getElementById('new-password-msg');
      const confirmPwdMsg = document.getElementById('confirm-password-msg');

      const toggleNewBtn = document.getElementById('toggle-new-pwd');
      const toggleConfirmBtn = document.getElementById('toggle-confirm-pwd');

      // Password visibility toggle helpers
      const setupToggle = (btn, input) => {
        btn.addEventListener('click', () => {
          const isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
        });
      };

      setupToggle(toggleNewBtn, newPwdInput);
      setupToggle(toggleConfirmBtn, confirmPwdInput);

      // Validation and dynamic state update
      const validate = () => {
        const newPwd = newPwdInput.value;
        const confirmPwd = confirmPwdInput.value;

        let isLengthValid = newPwd.length >= 12;
        let isMatchValid = confirmPwd.length > 0 && newPwd === confirmPwd;

        // Inline guidance / validation for new password
        if (newPwd.length > 0 && !isLengthValid) {
          newPwdMsg.textContent = 'Password must be at least 12 characters.';
          newPwdMsg.className = 'text-[13px] text-atlas-error mt-2 leading-tight';
        } else {
          newPwdMsg.textContent = 'Use at least 12 characters.';
          newPwdMsg.className = 'text-[13px] text-atlas-muted mt-2 leading-tight';
        }

        // Inline guidance / validation for confirm password
        if (confirmPwd.length > 0 && !isMatchValid) {
          confirmPwdMsg.textContent = 'Passwords do not match.';
          confirmPwdMsg.classList.remove('hidden');
        } else {
          confirmPwdMsg.textContent = '';
          confirmPwdMsg.classList.add('hidden');
        }

        // Enable or disable primary action
        if (isLengthValid && isMatchValid) {
          submitBtn.disabled = false;
          submitBtn.className = 'w-full h-12 rounded-lg font-medium text-[15px] transition-colors duration-150 flex items-center justify-center bg-atlas-primary hover:bg-atlas-primaryHover text-white cursor-pointer shadow-sm';
        } else {
          submitBtn.disabled = true;
          submitBtn.className = 'w-full h-12 rounded-lg font-medium text-[15px] transition-colors duration-150 flex items-center justify-center bg-atlas-disabledBg text-atlas-disabledText cursor-not-allowed';
        }
      };

      newPwdInput.addEventListener('input', validate);
      confirmPwdInput.addEventListener('input', validate);
    });
  </script>
<!-- END: Interactive Logic -->
</body></html>
